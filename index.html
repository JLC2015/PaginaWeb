<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ti amoooo...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffd9e2;
    --ink: #2a1a4a;
    --card: #fff7f9;
    --accent: #ff4f7b;
    --mint: #7ee8c7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif; font-weight: 500;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 460px; padding: 28px 20px 40px; text-align: center; }
  h1 {
    font-family: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
    font-weight: 400; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.05; margin: 8px 0 6px;
  }
  .sub { margin: 0 0 24px; font-weight: 800; }
  .big {
    background: var(--ink); color: var(--card);
    border-radius: 28px; padding: 22px 16px; transform: rotate(-1.5deg);
    box-shadow: 6px 6px 0 var(--accent);
  }
  .big .n {
    font-family: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
    font-size: clamp(3.4rem, 22vw, 5.4rem); line-height: 1; color: var(--mint);
  }
  .big .l { font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 28px 0 24px; }
  .u { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 4px; }
  .u b { display: block; font-family: "Bagel Fat One", "Arial Black", system-ui, sans-serif; font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
  .u span { font-size: .85rem; font-weight: 800; }
  .frase {
    min-height: 4.2em; display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; font-weight: 800; margin: 0 0 16px; padding: 0 6px;
  }
  button {
    font: inherit; font-weight: 800; font-size: 1.05rem; cursor: pointer;
    background: var(--accent); color: #fff; border: 3px solid var(--ink); border-radius: 999px;
    padding: 14px 26px; box-shadow: 0 5px 0 var(--ink); touch-action: manipulation;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  .foot { margin-top: 26px; font-size: .9rem; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1233; --ink: #ffe3ea; --card: #2c1d4d; --accent: #ff4f7b; }
    :root:not([data-theme="light"]) .big { background: #ffe3ea; color: #2a1a4a; }
    :root:not([data-theme="light"]) .big .n { color: #d6245a; }
    :root:not([data-theme="light"]) button { color: #fff; }
  }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Solo llevamos</h1>
  <p class="sub" id="sub"></p>

  <div class="big">
    <div class="n" id="dias">0</div>
    <div class="l">Dias Conociendonos...</div>
  </div>

  <div class="grid">
    <div class="u"><b id="y">0</b><span>años</span></div>
    <div class="u"><b id="m">0</b><span>meses</span></div>
    <div class="u"><b id="d">0</b><span>días</span></div>
    <div class="u"><b id="h">0</b><span>horas</span></div>
    <div class="u"><b id="min">0</b><span>minutos</span></div>
    <div class="u"><b id="s">0</b><span>segundos</span></div>
  </div>

  <p class="frase" id="frase" aria-live="polite"></p>
  <button id="btn" type="button">Otra frase</button>

  <p class="foot" id="foot"></p>
</main>

<script>
  const SU_NOMBRE = "Dary";
  const TU_NOMBRE = "de: yo obvioooooo";
  const INICIO = new Date(2026, 4 , 23, 0, 0, 0);
  const FRASES = [
    "Te amo muchoteeeeee pero asi comoooo caletaaaaaaaa",
    "Necesitamooooooooos Feeeeeeeeeeeeeeeeeeeeeee",
    "Sabe sorprendentemente es dificilisimo esquivar sus golpes",
    "La verdad el pinguino si tenia esa forma pero ya era dificil arrepentirme",
    "Agradezco a Dios que fue a hacer aseo conmigo",
    "Me encantaria regalarle una piedrita como un pinguino",
    "Sabe las nutrias duermen de la patita para no separarse mientras duermen, no me quiere dar la patita?",
    "Las girafas huelen la orina de su pareja para saber si estan para aparearse, asqueroso pero me parecio chistosisimo aksjfkasjdk",
    "Yo le dije que me iba a terminar de comer su pansito",
    "Que manera de verse prot usted cuando dirige",
    "oiga en serio la quiero es mi todito",
    "Nunca me devolvio el tapper",
    "Del 1 al 10 la amo un 10",
    "El dia del matrimonio es un recuerdo muy lindo cuando salimos a caminar a la lluvia",
    "Su buenos diaaaas me alegra el dia al instante",
    "yo creo que una casa con un rambito y un gatito seria muy lindo para vivir",
    "Ha hecho muy lindo para mi ir a clases por que despues puedo verla",
    "Tenemos el pie de limon pendiente hace mucho tiempo, ojala se pueda",
    "No tenia para nada pensado hacerle esto pero queria hacer algo por usted",
    "No importa cuando lea esto Te Amo <3",
    "Estamos claros que el pobrecito va a tener demasiada frente ajdkjdskafjkj",
    "Si me hacen eleguir entre usted y el pulmay voy a comer demasiado triste :c"

  ];
  // ========================

  document.getElementById("foot").textContent = "— " + TU_NOMBRE;
  document.title = "Tiamo " + SU_NOMBRE;

  const $ = id => document.getElementById(id);

  function tick() {
    const now = new Date();
    if (now < INICIO) { $("dias").textContent = 0; return; }

    let y = now.getFullYear() - INICIO.getFullYear();
    let m = now.getMonth() - INICIO.getMonth();
    let d = now.getDate() - INICIO.getDate();
    let h = now.getHours() - INICIO.getHours();
    let mi = now.getMinutes() - INICIO.getMinutes();
    let s = now.getSeconds() - INICIO.getSeconds();

    if (s < 0) { s += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
    if (m < 0) { m += 12; y--; }

    $("dias").textContent = Math.floor((now - INICIO) / 86400000).toLocaleString("es");
    $("y").textContent = y; $("m").textContent = m; $("d").textContent = d;
    $("h").textContent = h; $("min").textContent = mi; $("s").textContent = s;
  }

  let ultima = -1;
  function nuevaFrase() {
    let i;
    do { i = Math.floor(Math.random() * FRASES.length); } while (i === ultima && FRASES.length > 1);
    ultima = i;
    $("frase").textContent = FRASES[i];
  }

  $("btn").addEventListener("click", nuevaFrase);
  nuevaFrase();
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
